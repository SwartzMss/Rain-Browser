<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rain Browser</title>
  <style>
    :root { color-scheme: dark; --bg: #101827; --panel: #182337; --panel-2: #202e46; --line: #31415d; --text: #eef4ff; --muted: #9eacc3; --blue: #65a7ff; }
    * { box-sizing: border-box; }
    body { width: 390px; margin: 0; padding: 18px; font-family: Inter, Segoe UI, Arial, sans-serif; color: var(--text); background: radial-gradient(circle at 100% 0, #263d62 0, var(--bg) 38%); }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 17px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; color: #102039; background: linear-gradient(135deg, #9dd0ff, #4f91ff); font-weight: 800; box-shadow: 0 6px 16px #4f91ff55; }
    h1 {
      margin: 0;
      font-size: 17px;
      letter-spacing: .2px;
    }
    .link-button { padding: 5px 8px; border: 0; background: transparent; color: var(--blue); }
    input, select, button {
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      font-size: 13px;
      color: var(--text); background: #121d30;
    }
    button {
      cursor: pointer;
      color: var(--text); background: var(--panel-2);
    }
    button.primary {
      width: 100%;
      margin-top: 12px;
      background: linear-gradient(135deg, #66adff, #397ef0);
      color: white;
      border-color: #66adff; box-shadow: 0 7px 18px #397ef044;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .target-card {
      margin-bottom: 12px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #182337cc;
    }
    .target-label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    #issueSelect {
      width: 100%;
    }
    #issueHint {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }
    .new-issue-fields {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }
    .new-issue-fields input {
      width: 100%;
    }
    .hidden {
      display: none;
    }
    #status {
      margin: 10px 0;
      font-size: 12px;
      color: var(--muted);
    }
    #resources {
      max-height: 260px;
      overflow-y: auto;
      border-top: 1px solid var(--line);
    }
    .resource {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
    }
    .resource-name {
      word-break: break-all;
      font-size: 13px;
    }
    .resource-url {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      word-break: break-all;
    }
    .empty {
      padding: 18px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header><div class="brand"><div class="logo">R</div><h1>Rain Browser</h1></div><button id="openOptions" class="link-button" type="button">设置 ⚙</button></header>

  <div class="target-card">
    <label class="target-label" for="issueSelect">目标 Issue</label>
    <select id="issueSelect">
      <option value="__new__">新建 Issue</option>
    </select>
    <div id="issueHint">登录 Rain 后可选择你拥有的已有 Issue。</div>
    <div id="newIssueFields" class="new-issue-fields">
      <input id="newIssueCode" type="text" maxlength="64" placeholder="Issue Code" />
      <input id="newIssueName" type="text" maxlength="128" placeholder="Issue Name" />
    </div>
  </div>

  <div id="status">正在扫描当前页面…</div>
  <div id="resources"></div>
  <button id="importButton" class="primary" disabled>导入 Rain</button>

  <script src="rain-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
