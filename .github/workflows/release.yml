name: Release

on:
  push:
    branches:
      - main
    paths:
      - "manifest.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read extension version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip existing release tag
        id: tag_check
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package extension
        if: steps.tag_check.outputs.exists == 'false'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PACKAGE="rain-browser-${TAG}.zip"
          zip -r "$PACKAGE" manifest.json src icons README.md
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Create tag and GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" "$PACKAGE" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      - name: Report existing release
        if: steps.tag_check.outputs.exists == 'true'
        run: echo "${{ steps.version.outputs.tag }} already exists; nothing to publish."
